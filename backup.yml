name: Backup Firestore
# Weekly encrypted backup of the whole database. Needs two repository secrets (see docs/CADANGAN.md):
#   FIREBASE_SERVICE_ACCOUNT  = full contents of the service-account JSON key
#   BACKUP_PASSPHRASE         = a long password you keep safe (without it the backup cannot be opened)
on:
  schedule:
    - cron: '0 17 * * 0'   # Sunday 17:00 UTC = Monday 00:00 WIB
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PW: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$SA" ] || { echo "::error::Secret FIREBASE_SERVICE_ACCOUNT belum dibuat"; exit 1; }
          [ -n "$PW" ] || { echo "::error::Secret BACKUP_PASSPHRASE belum dibuat"; exit 1; }
      - name: Install export tool
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Export database
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/backup.mjs out
      - name: Encrypt (AES-256)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar czf backup.tar.gz -C out .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in backup.tar.gz -out "partflow-backup-$(date -u +%F).tar.gz.enc" -pass env:BACKUP_PASSPHRASE
          rm -rf out backup.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: partflow-backup
          path: partflow-backup-*.tar.gz.enc
          retention-days: 90
